name: Validate standalone chapter workflow
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python skills/chapter-writing-with-visuals/scripts/validate_bundle.py
      - run: python -m unittest discover -s tests -v
