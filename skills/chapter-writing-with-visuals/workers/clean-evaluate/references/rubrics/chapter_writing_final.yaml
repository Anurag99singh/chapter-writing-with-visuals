pass_threshold: 0.90

sections:
  - id: structure_preservation
    name: "final chapter structure vs canonical chapter"
    match: fixed
    weight: 0.20
    purpose: "Artifact B preserves the written chapter while approved visuals are placed."
    dimensions:
      structural:
        weight: 0.60
        checks:
          - "Main sections and approved subsections remain in the same order as Artifact A"
          - "Approved [TECH], [WOW MOMENT], reader transformation, and fixed punch-line commitments remain present"
          - "Main section headings use numbered punctuation such as 1., 2., 3."
      consistency:
        weight: 0.40
        checks:
          - "No approved section or subsection is silently added, removed, or moved"

  - id: evidence_preservation
    name: "facts, evidence, citations, and caveats"
    match: dynamic
    weight: 0.25
    purpose: "Visual Placement preserves authored prose and native formatting while inserting approved visuals."
    dimensions:
      content_completeness:
        weight: 0.45
        checks:
          - "Named examples, statistics, citations, and source attributions used in Artifact A remain materially preserved where the supported claim remains"
          - "No new factual source or unsupported evidence appears in Artifact B"
      consistency:
        weight: 0.55
        checks:
          - "Claims are not strengthened beyond Artifact A/Deep Research"
          - "Canonical caveats and uncertainty are not removed for stylistic momentum"
          - "Generated explanatory visuals are not presented as evidence and do not replace canonical citations"
    red_flags:
      - "A citation/source is swapped or invented during visual placement"
      - "A statistic or factual claim changes meaning"
      - "A generated explanatory visual is cited as though it were an evidence source"

  - id: authored_style_preservation
    name: "integrated Anshul reader-facing style preservation"
    match: fixed
    weight: 0.25
    purpose: "Artifact B preserves the integrated writing output; there is no second voice rewrite."
    dimensions:
      quality:
        weight: 0.60
        checks:
          - "Opening establishes a familiar shift/tension quickly rather than using a generic Introduction"
          - "Paragraphs are generally short and readable, usually one idea per paragraph"
          - "Plain English precedes or accompanies technical jargon"
          - "Examples and evidence are integrated into causal reasoning rather than stacked like a research report"
          - "Transitions explain why the next idea follows"
          - "Conclusion returns to the opening tension and lands the chapter thesis without generic future-hype"
      purpose_alignment:
        weight: 0.40
        checks:
          - "Voice is conversational/direct product-leader prose rather than academic, consultant, or social-engagement copy"
          - "No hashtags, engagement bait or invented personal anecdotes; preserve authorised functional heading icons"
          - "Bullets appear only for genuine sets/taxonomies/checklists/comparisons"

  - id: clean_reader_facing_gate
    name: "clean reader-facing Artifact B"
    match: fixed
    weight: 0.10
    purpose: "Workflow and evaluator metadata must stay outside the final manuscript."
    dimensions:
      structural:
        weight: 1.0
        checks:
          - "No Chapter Writing Notes in Artifact B"
          - "No Manuscript Handoff Package in Artifact B"
          - "No Completeness Summary in Artifact B"
          - "No evaluator findings/divider blocks in Artifact B"
          - "No Unified Visual Review metadata, GEN IDs, KEEP/EXCLUDE/PENDING fields, extraction/generation statuses, or placement audit in reader prose"

  - id: visual_accounting
    name: "human visual decisions and placement report"
    match: fixed
    weight: 0.20
    purpose: "Every human decision must be honored using the exact approved asset and remain auditable outside the reader-facing chapter."
    dimensions:
      content_completeness:
        weight: 0.50
        checks:
          - "Every KEEP candidate in Unified Visual Review is accounted for in the placement report as INSERTED or FAILED with a specific reason"
          - "Every EXCLUDE candidate is accounted for as EXCLUDED"
          - "Every inserted figure has a caption, appropriate attribution, and accessibility description when native alt text is unavailable"
          - "Placement Report records candidate origin so VIS and GEN accounting is distinguishable"
      consistency:
        weight: 0.50
        checks:
          - "No EXCLUDE candidate appears in Artifact B"
          - "Every inserted candidate is GEN-* / GENERATED_EXPLAINER and uses its exact human-KEEP asset; no source extraction or substitute"
          - "Every inserted GEN candidate uses the exact generated asset reviewed and kept by the human"
          - "No GEN candidate is rerendered, restyled, edited, or substituted during placement"
          - "No failed KEEP is silently replaced with another source or generated image"
          - "Figure numbering in Artifact B matches the placement report"
    red_flags:
      - "Any current Unified Visual Review candidate remains PENDING"
      - "A failed KEEP was silently replaced with another image"
      - "A human-KEEP GEN asset was regenerated or replaced during placement"
      - "A VIS candidate was replaced by a generated approximation of the source figure"

preservation_gate:
  rules:
    - "Reader-facing prose, headings, paragraph order, citations, numbers and fixed punchlines match Artifact A after removing workflow appendices and accounting for inserted captions/accessibility text"
    - "Native bold/italic runs and meaningful bullet lead-ins are preserved; no added preview labels or independent voice rewrite"
    - "Missing matching integrated writing execution gate blocks final pass regardless of weighted score"

# Mandatory presentation gate (not averaged away by weighted scoring)
presentation_gate:
  profile_id: personal-agents-approved-v1
  rules:
    - "Native presentation validator passes on current artifact/revision and actual planned locators"
    - "Functional heading icons and selective existing opening emphasis are implemented; generic feature counts are not sufficient"
    - "Explanatory parallel lists have native bullets, bold meaningful lead-ins and complete explanations"
    - "Numbered main headings and unnumbered subsections follow approved profile; internal mapping IDs/tags stay in Notes"
    - "Reader citations stay plain with concise italic evidence attribution; exact source URLs remain in Handoff"
    - "Missing, stale or failed presentation proof blocks pass regardless of weighted score"
